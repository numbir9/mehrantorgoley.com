<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Mehran C. Torgoley</title>
<meta name="description" content="Get in touch with director Mehran C. Torgoley about features, shorts, music videos and commercials.">
<link rel="canonical" href="https://mehrantorgoley.com/contact/">
<meta property="og:title" content="Contact — Mehran C. Torgoley">
<meta property="og:image" content="https://mehrantorgoley.com/assets/img/golden-doorway-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <a class="brand" href="/">MEHRAN C. TORGOLEY</a>
  <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
  <nav class="nav" id="nav">
    <a href="/#work">Work</a><a href="/shorts/">Shorts</a><a href="/music-videos/">Music videos</a><a href="/#about">About</a><a href="/contact/" aria-current="page">Contact</a>
  </nav>
</header>

<main id="main">
  <section class="page-head">
    <h1 class="display"><span class="mask"><span>Let’s make <span class="outline">something</span></span></span></h1>
  </section>

  <section class="wrap contact-page">
    <form class="cform" id="cform" action="https://formsubmit.co/hello@mehrantorgoley.com" method="POST" novalidate>
      <div class="field">
        <label for="f-name" class="mono">Name</label>
        <input id="f-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="f-email" class="mono">Email</label>
        <input id="f-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="f-type" class="mono">Project</label>
        <select id="f-type" name="project">
          <option>Feature</option>
          <option>Short film</option>
          <option>Music video</option>
          <option>Commercial</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field wide">
        <label for="f-msg" class="mono">Message</label>
        <textarea id="f-msg" name="message" rows="7" required></textarea>
      </div>
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="New inquiry — mehrantorgoley.com">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://mehrantorgoley.com/contact/?sent=1">
      <div class="form-foot wide">
        <button class="btn btn-solid" type="submit">Send <span class="arrow">→</span></button>
        <p class="form-status mono" role="status" aria-live="polite"></p>
      </div>
    </form>

    <aside class="direct">
      <p class="mono">Rather use your own email?</p>
      <div class="picker">
        <button class="btn picker-btn" type="button" aria-expanded="false" aria-controls="picker-menu">Email me directly <span class="arrow" aria-hidden="true">↓</span></button>
        <ul class="picker-menu" id="picker-menu" hidden>
          <li><a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=hello@mehrantorgoley.com&amp;su=Project%20inquiry" target="_blank" rel="noopener">Gmail <span>↗</span></a></li>
          <li><a href="https://outlook.office.com/mail/deeplink/compose?to=hello@mehrantorgoley.com&amp;subject=Project%20inquiry" target="_blank" rel="noopener">Outlook <span>↗</span></a></li>
          <li><a href="https://compose.mail.yahoo.com/?to=hello@mehrantorgoley.com&amp;subject=Project%20inquiry" target="_blank" rel="noopener">Yahoo Mail <span>↗</span></a></li>
          <li><a href="mailto:hello@mehrantorgoley.com?subject=Project%20inquiry" data-nocopy>Mail app on this device <span>↗</span></a></li>
          <li><button type="button" class="copy-addr">Copy address <span>⧉</span></button></li>
        </ul>
      </div>
      <p class="alt"><a class="mail" href="mailto:hello@mehrantorgoley.com">hello@mehrantorgoley.com</a></p>
    </aside>
  </section>
</main>

<footer class="contact contact-slim" id="contact">
  <div class="foot">
    <a class="mail" href="mailto:hello@mehrantorgoley.com">hello@mehrantorgoley.com</a>
    <span class="mono" data-clock>California</span>
    <span class="links"><a href="https://www.imdb.com/name/nm1977604/" rel="noopener">IMDb</a><a href="https://vimeo.com/numbir9" rel="noopener">Vimeo</a></span>
  </div>
</footer>

<script src="/assets/js/site.js"></script>
</body>
</html>
